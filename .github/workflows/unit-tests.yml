name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: GoogleTest on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Configure unit tests
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build unit tests
        run: cmake --build build --target vaslet_unit_tests --parallel 2

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure --no-tests=error
